# 👥 HRMS Platform

**A Human Resource Management System with Employee Self-Service (ESS) — QA & Automation Portfolio Project**

> This repository documents the QA strategy, manual and automated test coverage, and testing
> approach behind an **HRMS platform**, focused on the **Employee Self-Service (ESS / MyInfo)**
> module — the portal employees use to log in and manage their own personal details.
>
> All content here uses **generic/sample data only**. No client names, company names, or
> confidential/production information appear anywhere. Dates and timelines are placeholders —
> update `[Timeline]` before publishing.
>
> 📍 **New here?** `docs/README.md` is a documentation map — it answers what this is, how it
> works, who's involved, and what it depends on, with a suggested reading order through the rest
> of the repo.

---

## 💡 What is an HRMS / ESS Module?

A Human Resource Management System streamlines core HR operations — payroll compliance,
attendance, leave, recruitment, performance management, onboarding, biometric integration — under
one platform with role-based access control.

The Employee Self-Service module, sometimes called "MyInfo," is the employee-facing slice of that
system: where an individual employee logs in and manages their own personal and contact details,
separate from what HR/Admin manages on their behalf. Because ESS is employee-facing and touches
personally identifiable information, it carries a distinct QA emphasis compared to admin-side HRMS
modules:

- **Strict field-level access control** — some fields (Employee ID, Date of Birth, Driver's
  License Number) are typically HR-managed and shown as read-only to the employee, while others
  (Nickname, Marital Status) are employee-editable
- **GUI element behavior correctness** — text boxes, combo boxes, radio buttons, and date pickers
  each need to behave exactly as their control type implies, since every employee in the company
  fills out this same form
- **File upload validation** — profile picture uploads need both format and size validation

### Who typically interacts with it?

| Role | What they do |
|---|---|
| **Employee (ESS user)** | Logs in, views and updates their own permitted personal/contact details |
| **HR Admin** | Creates ESS user accounts, manages the fields employees cannot self-edit |

## 🧪 Types of Testing Performed

- **Functional Testing** — login, personal/contact details save and update flows
- **GUI Testing** — field enabled/disabled state, control-type behavior (text box, combo box,
  radio button, date picker)
- **Database/Data-Level Testing** — validating saved changes are correctly persisted
- **File Upload Validation** — format and size constraint testing
- **API Testing** — via Postman with SQL-backed validation
- **Security-Adjacent Field-Authorization Testing** — confirming HR-controlled fields are
  rejected by the save API directly, independent of the UI (maps to OWASP's Broken Object
  Property Level Authorization classification)
- **Performance Testing** — concurrent login/access-storm load testing with JMeter
- **Regression Testing** / **Smoke & Sanity Testing**

## 🔄 How It Works — ESS Save Flow

```mermaid
flowchart TD
    A["🔐 Employee logs in"] --> B["📋 Personal Details form loads<br/>with per-field enabled/disabled state"]
    B --> C["✏️ Employee edits an employee-editable field"]
    C --> D["📤 Save submitted to the API"]
    D --> E{"🛡️ API independently validates:<br/>is this field writable by this role?"}
    E -->|Yes| F["✅ Field updated in PIM, confirmation shown"]
    E -->|"No — field is HR-controlled"| G["🚫 Write rejected — regardless of what the UI sent"]

    classDef gate fill:#4a148c,stroke:#8e24aa,color:#fff
    classDef good fill:#1b5e20,stroke:#43a047,color:#fff
    classDef bad fill:#b71c1c,stroke:#e53935,color:#fff
    class E gate
    class F good
    class G bad
```

The enabled/disabled state rendered in the UI is a usability signal, not a security boundary — the
save API has to make its own independent decision about which fields a given role may write, every
single time, regardless of what the client submits.

## 🤖 Automation Approach

Automation is built with **Selenium WebDriver + Java + TestNG**, targeting the highest-priority
ESS flows (login and personal details save) as a complement to the broader manual regression
suite, backed by JMeter for concurrent login/access-storm performance testing.

### Priority Automated Scenarios

1. Login — valid credentials
2. Login — invalid credentials (negative cases)
3. Personal Details — field enabled/disabled state verification
4. Personal Details — save/update confirmation
5. Concurrent login/access-storm load testing (JMeter)

# HRMS Platform — Architecture & Flow

> Every diagram below is drawn in Mermaid, which GitHub renders natively in-page — nothing here
> requires opening another site or tool to read it.

## 1. System Architecture — Who Talks to Whom

```mermaid
flowchart TD
    Employee([👤 Employee]) --> ESS["🖥️ ESS / MyInfo Portal"]
    HRAdmin([🧑‍💼 HR Admin]) --> AC["⚙️ Admin Console"]

    ESS --> GW["🚪 API Gateway"]
    AC --> GW

    GW --> Auth["🔑 Authentication Service"]
    GW --> PIM["📇 PIM — Personnel Information Management<br/>(system of record)"]
    GW --> FS["🗂️ File Storage Service<br/>(profile picture uploads)"]

    PIM --> Payroll["💰 Payroll Processing<br/>consumes DOB, Employee ID"]
    PIM --> Compliance["📜 Compliance Reporting<br/>PF / ESI / TDS"]
    AC --> PIM

    classDef person fill:#1a237e,stroke:#5c6bc0,color:#fff
    classDef service fill:#004d40,stroke:#26a69a,color:#fff
    classDef authority fill:#4a148c,stroke:#ab47bc,color:#fff
    class Employee,HRAdmin person
    class ESS,AC,GW,Auth,FS service
    class PIM,Payroll,Compliance authority
```

Payroll and Compliance are drawn as downstream consumers of PIM, not of the ESS form itself,
because the fields ESS marks HR-controlled — Date of Birth, Employee ID, Driver's License Number —
aren't arbitrarily locked. Payroll and statutory compliance reporting (PF, ESI, TDS) read them
directly from PIM as system-of-record values. An access-control bug in ESS doesn't just corrupt
one employee's profile view — it can corrupt what payroll and compliance systems compute from, if
the write actually reaches PIM.

## 2. Editing & Saving Personal Details

```mermaid
sequenceDiagram
    actor Employee
    participant UI as ESS Portal
    participant API as Personal Details API
    participant PIM

    Employee->>UI: Opens Personal Details form
    UI->>API: GET /personal-details
    API->>PIM: Fetch employee record
    PIM-->>API: Full record
    API-->>UI: Record + per-field editable flags
    UI-->>Employee: Renders form — HR-controlled fields shown disabled
    Employee->>UI: Edits Nick Name, clicks Save
    UI->>API: PATCH /personal-details { nickName: "Ravi" }
    API->>API: Validate — is "nickName" in THIS role's allowed-write-field list?
    API->>PIM: Update only the validated field(s)
    PIM-->>API: Saved
    API-->>UI: 200 + confirmation
    UI-->>Employee: "Details are saved"
```

The line that matters most in this diagram is `API->>API: Validate — is "nickName" in THIS role's
allowed-write-field list?` That check has to run regardless of what the UI sent, and specifically
per field, not just "is this employee allowed to call this endpoint at all." Section 3 shows what
happens when that line gets skipped.

## 3. Field-Level Access Control as Defense in Depth — the Real Mechanism Behind Defect #1

Defect #1 (Date of Birth editable by the employee) maps directly onto a named, well-documented API
vulnerability class — OWASP API3:2023, Broken Object Property Level Authorization (BOPLA), which
consolidates what used to be called "Mass Assignment": an API that checks whether a user can
access an *object* (this employee's own record) but never checks whether they can write a specific
*property* on it.

```mermaid
flowchart TD
    Submit["📤 Employee submits PATCH /personal-details<br/>{ dateOfBirth: '1990-01-01', nickName: 'Ravi' }"] --> UILayer{"UI Layer:<br/>was Date of Birth rendered disabled?"}
    UILayer -->|Yes, disabled in the UI| Trust["⚠️ Treated as 'handled' —<br/>but a disabled UI control is NOT a real security boundary"]
    Trust --> APILayer{"API Layer:<br/>does the save endpoint independently check<br/>WHICH fields this role may write?<br/>(the actual BOPLA/Mass-Assignment check)"}
    APILayer -->|"Yes — field-level authorization enforced"| Blocked["✅ dateOfBirth change REJECTED;<br/>nickName change ACCEPTED"]
    APILayer -->|"No — endpoint accepts and persists<br/>the whole submitted object<br/>(Defect #1's actual root cause)"| Leak["❌ dateOfBirth silently updated —<br/>a payroll/compliance system-of-record field<br/>changed by the employee themselves"]

    classDef risk fill:#e65100,stroke:#fb8c00,color:#fff
    classDef good fill:#1b5e20,stroke:#43a047,color:#fff
    classDef bad fill:#b71c1c,stroke:#e53935,color:#fff
    class Trust risk
    class Blocked good
    class Leak bad
```

Disabling a field in a browser only stops a well-behaved browser session from *rendering* an
editable input — it does nothing against a request sent directly to the API, whether through a
modified request, a replay, or a client bug that simply forgot to strip the field. The fix —
enforcing the field-access-control list at the form-rendering layer *and* at the save/API layer as
defense-in-depth — is this diagram's right-hand branch: the UI layer is a UX convenience, the API
layer is the actual control, and a system that only has the first is one missing authorization
check away from the exact defect that shipped here.

## 4. File Upload Validation — the Real Mechanism Behind Defect #2

```mermaid
flowchart TD
    Upload["📎 Employee uploads a profile picture: 1.4 MB .jpg"] --> ClientCheck{"Client-side check:<br/>is the file extension in [jpg, png, gif]?"}
    ClientCheck -->|No| RejectFormat["🚫 Rejected — format error shown immediately"]
    ClientCheck -->|Yes| ServerCheck{"Server-side check:<br/>is the file SIZE also independently validated here,<br/>not just the extension?"}
    ServerCheck -->|"Yes — size checked server-side"| RejectSize["✅ Rejected — 'file exceeds 1MB' error (correct behavior)"]
    ServerCheck -->|"No — only the extension was ever checked<br/>(Defect #2's actual root cause)"| Accept["❌ File accepted despite exceeding<br/>the stated 1MB limit"]

    classDef good fill:#1b5e20,stroke:#43a047,color:#fff
    classDef bad fill:#b71c1c,stroke:#e53935,color:#fff
    class RejectFormat,RejectSize good
    class Accept bad
```

This is the same *shape* of bug as Defect #1, even though it's a completely different feature:
both are a constraint enforced at exactly one layer, and that layer happened to be the wrong one
to rely on alone. The fix in both cases is structurally identical: validate server-side, and treat
client-side validation as UX, not security or correctness.

---

**Source for the real-world standard referenced above:** OWASP API3:2023 — Broken Object Property
Level Authorization.

# HRMS Platform — Business Overview

> **Start here if you're new to QA, in HR, or coming from a non-QA technical role.** This document
> covers the HRMS/ESS module and its field-access model before you look at a single test case.

## 1. What problem does it solve?

Companies need a system where employees can view and manage some of their own information — a
nickname, marital status, contact preferences — without needing HR to make every small update,
while other, more sensitive or system-of-record fields (Employee ID, Date of Birth) stay
HR-controlled. The ESS/MyInfo module is that self-service layer.

## 2. Core Modules and Their Submodules

| Module | Submodules / Key Components | Responsible For | Primarily Tested Via |
|---|---|---|---|
| **Login / Authentication** | Credential Validation · Negative-Case Error Messaging | ESS user credential validation | UI Automation + Functional Testing |
| **Personal / Contact Details (MyInfo)** | Field Rendering · Save/Persistence · Field-Level Write Authorization | The employee's own editable and view-only profile fields | GUI Testing + API Testing |
| **File Upload (Profile Picture)** | Format Validation · Size Validation | Accepting a profile picture only within accepted formats and the size limit | Functional Testing |

"Field-Level Write Authorization" gets called out as its own submodule rather than folded into
"Save/Persistence" because a save endpoint can correctly persist data — the save genuinely works —
while still authorizing the *wrong set of fields* to be written. Those are two different
correctness properties.

## 3. The Field-Access-Control Model

| Field | Access |
|---|---|
| Full Name, Middle Name, Last Name | Employee-editable (text) |
| Employee ID | HR-controlled (disabled to employee) |
| Other ID | Employee-editable (text) |
| Driver's License Number | HR-controlled (disabled to employee) |
| License Expiry Date | Employee-editable (date picker) |
| Gender | Employee-editable (radio button) |
| Nationality | Employee-editable (combo box) |
| Marital Status | Employee-editable (combo box) |
| Date of Birth | HR-controlled (disabled to employee) |
| Nick Name | Employee-editable (text) |
| Smoker | Employee-editable |
| Military Service | Employee-editable (text) |

A field that's supposed to be HR-only but accidentally left editable is a data-integrity risk. A
field that's supposed to be employee-editable but stuck disabled is a usability regression that
generates HR support tickets. Both directions need explicit test coverage.

## 4. GUI Control Types on This Form

| Control Type | Fields | Correct Behavior |
|---|---|---|
| Text Box | Full Name, Middle Name, Last Name, Other ID, Nick Name, Military Service | Accepts free text input |
| Combo Box | Marital Status, Nationality | Displays a list of items; allows exactly one selection at a time |
| Radio Button | Gender | Allows exactly one option selected at a time |
| Date Picker | License Expiry Date | Selected date populates the associated text field exactly |
| File Upload | Profile Picture | Accepts jpg/png/gif; enforces a size limit (e.g. under 1 MB) |

## 5. Glossary

| Term | Meaning |
|---|---|
| **ESS** | Employee Self-Service — the employee-facing portal |
| **MyInfo** | Common name for the ESS personal-details module |
| **PIM** | Personnel Information Management — the underlying employee data model |
| **Disabled field** | A form field the current user cannot edit, typically HR/Admin-managed |
| **BOPLA** | OWASP API3:2023's name for an API that authorizes access to an *object* but not to specific *properties* on it |
| **PF / ESI / TDS** | Provident Fund / Employee State Insurance / Tax Deducted at Source |

## 6. Stakeholders / Involved Parties

| Stakeholder | Role in this module |
|---|---|
| **Employee (ESS user)** | Logs in, views and updates their own permitted personal/contact details |
| **HR Admin** | Creates ESS user accounts, manages HR-controlled fields employees cannot self-edit |
| **Payroll Team** | Consumes system-of-record fields for payroll and compliance processing |
| **IT/Platform Admin** | Manages ESS access provisioning and system configuration |
| **QA Team** | Maintains field-by-field GUI validation coverage |

## 7. Dependencies

- **PIM (Personnel Information Management)** — the underlying employee data store ESS reads from
  and writes to
- **Authentication Service** — ESS login credential validation
- **File Storage Service** — profile picture uploads, with format/size validation

Because HR-controlled fields feed directly into payroll and compliance processing, an
access-control defect here isn't just a UI bug — it's a data-integrity risk with downstream
payroll/compliance impact.

## 1. Full Tech Stack, and Why Each Tool

## 2. Skills Demonstrated

| Skill | Demonstrated By |
|---|---|
| **Manual / Functional Testing** | The full login + field-by-field Personal Details test suite |
| **API Testing** | SQL-backed validation confirming PIM's actual stored value |
| **UI Automation** | A Selenium + TestNG spec covering login and field-state verification |
| **Security-Adjacent Testing** | A dedicated defense-in-depth category tracing to OWASP BOPLA |
| **Requirement Traceability (RTM)** | A worked requirement → test case → status mapping |

## 3. The Testing Pyramid Applied to This Project

```mermaid
flowchart TD
    UNIT["Unit Tests<br/>(owned by the application dev team — out of this QA scope)"]
    DATA["Data-Level Tests<br/>SQL — confirming PIM's actual stored value"]
    API["API Tests<br/>field-level write authorization, login contract"]
    UI["UI / GUI Tests<br/>Selenium — login, field state, control-type behavior"]
    PERF["Performance Tests<br/>JMeter — concurrent login/access storms"]
    UNIT --> DATA --> API --> UI --> PERF

    classDef layer fill:#263238,stroke:#607d8b,color:#fff
    class UNIT,DATA,API,UI,PERF layer
```

Data-Level sits just above Unit here for a specific reason: a UI assertion that a field "looks
disabled" can't tell you whether a direct API call bypassing that UI would still be rejected.

## 4. CI/CD — Suggested Pipeline Shape

```mermaid
flowchart LR
    PR["Pull Request / Merge"] --> Build["Maven build"]
    Build --> API["API + SQL data-level suite"]
    API --> UI["Selenium/TestNG regression suite"]
    UI --> Gate{"All required checks pass?"}
    Gate -->|Yes| Merge["Merge allowed"]
    Gate -->|No| Block["Build failed — surfaced in CI"]
    Merge --> Nightly["Nightly: JMeter login/access-storm run"]
```

## 5. Performance Testing, In Depth

HRMS/ESS has a performance profile that looks almost nothing like a typical transactional
platform: every employee in the company uses it, but each one just views or edits their own
profile occasionally. That's high **concurrency of low-value requests**, not high **throughput of
transactional volume**.

| Test Type | What It Targets |
|---|---|
| **Login storm / concurrent-session load test** | Many employees logging in within the same narrow window |
| **Mass-update spike test** | A company-wide policy change prompting many employees to edit and save Personal Details |
| **File-upload soak test** | Sustained profile-picture upload traffic over a longer window |

<script type="text/markdown" id="src-ui">
# HRMS Platform — UI Consistency

> Field state (enabled/disabled), control-type behavior, and validation messaging surface across
> the ESS Personal/Contact Details form. This document covers whether it's represented
> **consistently** across the form and its supporting confirmation/error states.

## Why This Matters More Here Than in Most Modules

This module's central risk is a field-access-control mismatch — a field that's supposed to be
HR-only editable by an employee, or vice versa. Since every employee in the company fills out this
same form, even a small, inconsistent enabled/disabled treatment scales instantly into a
company-wide data-integrity or support-load problem.

## 1. Field State Representation Consistency

| State | Expected Visual Treatment |
|---|---|
| Employee-editable field | Normal input styling, fully interactive |
| HR-controlled (disabled) field | Visually distinct disabled/greyed styling — never identical in appearance to an editable field |
| Field with a validation error | Clear inline error styling, consistent across all control types |

## 2. Save Confirmation & Error Messaging Consistency

- The "details are saved" confirmation message has to appear identically worded regardless of
  which field(s) were changed
- Login error messages have to be worded identically across all three negative-case combinations —
  never a different message that inadvertently reveals which part was wrong

## 3. File Upload Validation Messaging Consistency

- The format-rejection message and the size-rejection message need to be distinct and specific — a
  generic "upload failed" message for both leaves an employee with no way to self-correct

## 4. Terminology Consistency

- "ESS" vs. "MyInfo" vs. "Personal Details," used interchangeably for the same module — pick one
  primary term
- "Disabled" vs. "Read-only" vs. "Locked" as different labels for the same HR-controlled-field
  concept

## 5. Cross-Browser & Responsive Consistency

- Do combo boxes, radio buttons, and the date picker render and behave identically across Chrome,
  Firefox, and Safari/WebKit?

## 6. Accessibility Consistency

- Are enabled/disabled field states distinguishable by more than color/opacity alone — also
  conveyed via `aria-disabled` and cursor state, for example?
